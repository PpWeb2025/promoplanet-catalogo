<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>Generador de propuestas — PromoPlanet</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #003471;
    --celeste: #00A8B4;
    --azul-light: #e8eef6;
    --celeste-light: #e0f7f9;
    --gris: #f4f5f7;
    --gris-borde: #e2e4e8;
    --texto: #1a1f2e;
    --texto-suave: #5a6070;
    --blanco: #ffffff;
    --radio: 10px;
    --sombra: 0 2px 16px rgba(0,52,113,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; color: var(--texto); background: var(--gris); font-size: 15px; }

  /* ── TOPBAR ── */
  .topbar {
    background: var(--azul); color: var(--blanco);
    padding: 0 2rem; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar-logo { font-family: 'DM Serif Display', serif; font-size: 1.3rem; text-decoration: none; }
  .topbar-logo span:first-child { color: var(--blanco); }
  .topbar-logo span:last-child  { color: var(--celeste); }
  .topbar-title { font-size: 0.8rem; color: rgba(255,255,255,0.65); letter-spacing: 0.08em; text-transform: uppercase; }
  .topbar-actions { display: flex; gap: 0.75rem; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 0.5rem 1.1rem; border-radius: 8px; border: 1.5px solid rgba(255,255,255,0.25); background: transparent; color: var(--blanco); font-size: 0.85rem; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; text-decoration: none; }
  .btn:hover { border-color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.08); }
  .btn-celeste { background: var(--celeste); border-color: var(--celeste); color: var(--blanco); }
  .btn-celeste:hover { background: #009aaa; border-color: #009aaa; }
  .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }

  /* ── MAIN LAYOUT ── */
  .layout { max-width: 1100px; margin: 0 auto; padding: 1.5rem; display: grid; grid-template-columns: 300px 1fr; gap: 1.5rem; }

  /* ── CARD ── */
  .card { background: var(--blanco); border: 1px solid var(--gris-borde); border-radius: var(--radio); padding: 1.25rem; box-shadow: var(--sombra); }
  .card-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--texto-suave); margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--gris-borde); }

  /* ── FORM ELEMENTS ── */
  .fld { margin-bottom: 0.85rem; }
  .fld label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--texto-suave); margin-bottom: 0.3rem; }
  .fld input, .fld select, .fld textarea {
    width: 100%; padding: 0.55rem 0.85rem;
    border: 1.5px solid var(--gris-borde); border-radius: 8px;
    font-family: 'DM Sans', sans-serif; font-size: 0.88rem; color: var(--texto);
    background: var(--blanco); transition: border-color 0.15s;
  }
  .fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--celeste); }
  .fld textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
  .fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .fld-row-3 { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 0.65rem; }

  /* ── CLIENTE ── */
  .cliente-select-wrap { margin-bottom: 0.85rem; }
  .cond-section { margin-top: 1rem; }
  .cond-section .card-title { margin-top: 0; }
  .btn-guardar-cliente { width: 100%; margin-top: 0.5rem; background: var(--celeste); border: none; color: var(--blanco); border-radius: 8px; padding: 0.6rem; font-size: 0.88rem; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
  .btn-guardar-cliente:hover { background: #009aaa; }
  .cliente-saved-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--celeste-light); color: var(--celeste); border-radius: 20px; padding: 3px 10px; font-size: 0.78rem; font-weight: 600; margin-bottom: 10px; }

  /* ── PRODUCTOS ── */
  .productos-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .productos-count { font-size: 0.82rem; color: var(--texto-suave); }
  .empty-productos { text-align: center; padding: 3rem 2rem; color: var(--texto-suave); font-size: 0.9rem; }
  .empty-productos .icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.4; }

  .producto-row {
    background: var(--blanco); border: 1px solid var(--gris-borde);
    border-radius: var(--radio); overflow: hidden; margin-bottom: 1rem;
  }
  .producto-row-top { display: flex; align-items: flex-start; gap: 1rem; padding: 1rem; border-bottom: 1px solid var(--gris-borde); }
  .producto-img {
    width: 80px; height: 80px; border-radius: 8px;
    background: var(--gris); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .producto-img img { width: 100%; height: 100%; object-fit: contain; }
  .producto-img .emoji { font-size: 2rem; opacity: 0.4; }
  .producto-info { flex: 1; }
  .producto-nombre { font-size: 0.95rem; font-weight: 600; color: var(--azul); }
  .producto-codigo { font-size: 0.78rem; color: var(--texto-suave); margin-top: 2px; }
  .producto-desc-edit { margin-top: 0.5rem; }
  .producto-desc-edit textarea {
    width: 100%; font-size: 0.82rem; line-height: 1.55;
    border: 1.5px solid var(--gris-borde); border-radius: 6px;
    padding: 0.4rem 0.65rem; font-family: 'DM Sans', sans-serif; color: var(--texto);
    resize: vertical; min-height: 60px; background: var(--gris);
    transition: border-color 0.15s;
  }
  .producto-desc-edit textarea:focus { outline: none; border-color: var(--celeste); background: var(--blanco); }
  .desc-label { font-size: 0.7rem; color: var(--texto-suave); font-weight: 600; margin-bottom: 3px; letter-spacing: 0.04em; }
  .producto-row-fields { padding: 0.75rem 1rem; background: var(--gris); }
  .producto-row-fields .fld-row-3 { margin: 0; }
  .producto-row-fields .fld { margin-bottom: 0; }
  .btn-quitar { background: none; border: none; color: var(--texto-suave); cursor: pointer; font-size: 1rem; padding: 4px; border-radius: 4px; transition: color 0.15s; }
  .btn-quitar:hover { color: #c0392b; }

  /* ── ACCIONES ── */
  .acciones-bar {
    position: sticky; bottom: 0; z-index: 50;
    background: var(--blanco); border-top: 1px solid var(--gris-borde);
    padding: 0.85rem 1.5rem;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 -4px 16px rgba(0,52,113,0.07);
  }
  .acciones-info { font-size: 0.82rem; color: var(--texto-suave); }
  .acciones-info strong { color: var(--azul); }
  .btn-preview {
    background: var(--azul); color: var(--blanco); border: none;
    border-radius: 8px; padding: 0.7rem 1.75rem;
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: background 0.15s;
    display: flex; align-items: center; gap: 8px;
  }
  .btn-preview:hover { background: #004a9e; }
  .btn-preview:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ════════════════════════════════════════════════
     PROPUESTA — vista de impresión
  ════════════════════════════════════════════════ */
  #vista-propuesta { display: none; }

  .prop-toolbar {
    background: var(--azul); color: var(--blanco);
    padding: 0.75rem 2rem; display: flex; align-items: center; gap: 1rem;
    position: sticky; top: 0; z-index: 100;
  }
  .prop-toolbar h2 { font-size: 0.9rem; font-weight: 500; flex: 1; }
  .btn-imprimir {
    background: var(--celeste); color: var(--blanco); border: none;
    border-radius: 8px; padding: 0.55rem 1.25rem;
    font-size: 0.88rem; font-weight: 600; cursor: pointer;
    font-family: 'DM Sans', sans-serif; display: flex; align-items: center; gap: 6px;
    transition: background 0.15s;
  }
  .btn-imprimir:hover { background: #009aaa; }

  /* Documento propuesta */
  .prop-doc { max-width: 800px; margin: 1.5rem auto; font-family: 'DM Sans', sans-serif; }
  .prop-page { background: var(--blanco); border: 1px solid var(--gris-borde); border-radius: 8px; margin-bottom: 1.5rem; overflow: hidden; }

  .prop-header, .prop-running-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 28px; background: #003471; }
  .prop-contact { text-align: right; font-size: 10px; color: rgba(255,255,255,0.85); line-height: 1.85; }
  .prop-running-header { display: none; }
  .prop-running-footer { display: none; position: fixed; bottom: 0.2cm; left: 0; right: 0; padding: 0 1.5cm 0.15cm; }
  .prop-footer-line { height: 3px; width: 100%; background: linear-gradient(to right, #003471, #00A8B4); -webkit-print-color-adjust: exact; print-color-adjust: exact; margin-bottom: 0.15cm; }
  .prop-footer-slogan { height: 0.35cm; width: auto; display: block; margin-left: auto; }

  .prop-intro { padding: 4px 28px 2px; font-size: 13px; }
  .prop-date { text-align: right; font-size: 13px; margin-bottom: 3px; color: #333; }
  .prop-saludo { font-size: 13px; line-height: 1.25; color: #333; }
  .prop-apertura { text-align: center; font-size: 13px; margin: 4px 0 6px; color: #333; }

  .prop-product-card { margin: 10px 28px 24px; border: 1px solid #e2e6ea; border-radius: 8px; padding: 20px; overflow: hidden; page-break-inside: avoid; break-inside: avoid; }
  /* Tarjeta: dos columnas */
  .prop-card-inner { display: flex; flex-direction: row; gap: 20px; align-items: flex-start; }

  /* Columna izquierda: galería ~44% */
  .prop-card-gallery { width: 44%; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }

  /* Tile imagen principal */
  .prop-img-tile-main {
    background: #fff;
    border: 1px solid #e2e6ea;
    border-radius: 6px;
    padding: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .prop-img-tile-main img { max-width: 100%; max-height: 220px; object-fit: contain; display: block; }
  .prop-img-tile-main .p-emoji { font-size: 3rem; opacity: 0.25; }

  /* Columna derecha: texto */
  .prop-card-desc { flex: 1; }
  .prop-card-desc-nombre { font-size: 13px; font-weight: 700; color: #003471; margin-bottom: 2px; line-height: 1.35; }
  .prop-card-desc-codigo { font-size: 10.5px; color: #777; margin-bottom: 10px; }
  .prop-desc-text { font-size: 12px; line-height: 1.75; color: #333; }

  /* Miniaturas: grilla 2×2, mismo tile */
  .prop-thumb-strip { display: flex; gap: 6px; flex-wrap: nowrap; }
  .prop-thumb { background: #fff; border: 1px solid #e2e6ea; border-radius: 6px; padding: 4px; flex: 1 1 0; aspect-ratio: 1 / 1; max-width: 64px; min-width: 0; display: flex; align-items: center; justify-content: center; }
  .prop-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .prop-footer { text-align: right; padding: 6px 28px 10px; font-size: 10.5px; color: #bbb; font-style: italic; }

  /* Página condiciones */
  .prop-cond-wrap { padding: 18px 28px 24px; }
  .prop-cond-title-main { font-size: 12.5px; font-weight: 700; color: #00A8B4; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
  .prop-cond-bloque { margin-bottom: 13px; }
  .prop-cond-label { font-weight: 700; font-size: 10.5px; letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 3px; color: #333; }
  .prop-cond-text  { font-size: 12px; line-height: 1.65; color: #444; }
  .prop-cond-firma { margin-top: 28px; text-align: center; font-size: 11px; color: #999; }

  .prop-spacer-table { width: 100%; border-collapse: collapse; }
  .prop-spacer-table > thead { display: table-header-group; }
  .prop-spacer-table > tfoot { display: table-footer-group; }
  .prop-spacer-table td { padding: 0; border: none; }

  /* Tabla de precios: después del spacer para ganar la cascada */
  .prop-price-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 16px; }
  .prop-price-table th,
  .prop-price-table td { padding: 7px 13px; }
  .prop-price-table th { background: #f2f2f2; font-weight: 600; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; text-align: left; }
  .prop-price-table .col-r { text-align: right; }

  .prop-spacer-cell { height: 0; }
  .prop-footer-cell { height: 0; }

  /* ── PRINT STYLES ── */
  @media print {
    @page { margin: 0; }
    .topbar, .layout, .acciones-bar, .prop-toolbar, #vista-editor { display: none !important; }
    #vista-propuesta { display: block !important; }
    .prop-doc { margin: 0; }
    .prop-page { border: none; border-radius: 0; margin-bottom: 0; box-shadow: none; overflow: visible; }
    .prop-cond-page { page-break-before: always; }
    body { background: white; margin: 0 1.5cm 1.5cm 1.5cm; }
    .prop-page > .prop-header { display: none; }
    .prop-running-header { display: flex; position: fixed; top: 0; left: 0; right: 0; padding: 10px 1.5cm; z-index: 1000; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .prop-running-footer { display: block; }
    .prop-product-card { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .prop-spacer-cell { height: calc(2.1cm + 22px); }
    .prop-intro + .prop-product-card .prop-img-tile-main img { max-height: 140px; }
    .prop-footer-cell { height: 0.8cm; }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .fld-row-3 { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<!-- ══════════════════════════════════════════
     VISTA EDITOR
══════════════════════════════════════════ -->
<div id="vista-editor">

  <div class="topbar">
    <a href="index.html" class="topbar-logo" target="_blank">
      <span>Promo</span><span>Planet</span>
    </a>
    <span class="topbar-title">Generador de propuestas</span>
    <div class="topbar-actions">
      <a href="index.html" class="btn btn-sm">← Volver al catálogo</a>
    </div>
  </div>

  <div class="layout">

    <!-- ── COLUMNA IZQUIERDA: CLIENTE ── -->
    <div>
      <div class="card">
        <div class="card-title">Cliente</div>

        <div class="cliente-select-wrap">
          <div class="fld">
            <label>Seleccionar cliente existente</label>
            <select id="select-cliente" onchange="onSelectCliente(this.value)">
              <option value="">— Nuevo cliente —</option>
            </select>
          </div>
        </div>

        <div id="form-cliente">
          <div class="fld">
            <label>Empresa *</label>
            <input type="text" id="cf-empresa" placeholder="Nombre de la empresa" />
          </div>
          <div class="fld">
            <label>Atención</label>
            <input type="text" id="cf-atencion" placeholder="Nombre y apellido del contacto" />
          </div>

          <div class="cond-section">
            <div class="card-title">Condiciones para este cliente</div>
            <div class="fld">
              <label>Validez del presupuesto</label>
              <textarea id="cf-validez" rows="2"></textarea>
            </div>
            <div class="fld">
              <label>Condiciones de pago</label>
              <textarea id="cf-pago" rows="2"></textarea>
            </div>
            <div class="fld">
              <label>Plazo de entrega</label>
              <textarea id="cf-entrega" rows="2"></textarea>
            </div>
            <div class="fld">
              <label>Producción personalizada</label>
              <textarea id="cf-produccion" rows="2"></textarea>
            </div>
            <div class="fld">
              <label>Envío</label>
              <textarea id="cf-envio" rows="2"></textarea>
            </div>
          </div>

          <button class="btn-guardar-cliente" onclick="guardarCliente()">
            Guardar cliente
          </button>
        </div>
      </div>
    </div>

    <!-- ── COLUMNA DERECHA: PRODUCTOS ── -->
    <div>
      <div class="card">
        <div class="productos-header">
          <div class="card-title" style="margin-bottom:0;border:none;padding:0">Productos de la propuesta</div>
          <span class="productos-count" id="prod-count"></span>
        </div>
        <div id="productos-lista"></div>
      </div>
    </div>

  </div><!-- /layout -->

  <!-- Barra de acción fija abajo -->
  <div class="acciones-bar">
    <div class="acciones-info" id="acciones-info"></div>
    <button class="btn-preview" id="btn-preview" onclick="mostrarPropuesta()">
      Ver propuesta
    </button>
  </div>

</div><!-- /vista-editor -->


<!-- ══════════════════════════════════════════
     VISTA PROPUESTA (imprimible)
══════════════════════════════════════════ -->
<div id="vista-propuesta">

  <div class="prop-toolbar">
    <button class="btn" onclick="volverEditor()" style="background:rgba(255,255,255,0.1)">← Volver</button>
    <h2>Propuesta comercial</h2>
    <button class="btn-imprimir" onclick="imprimirPropuesta()">
      🖨️ Imprimir / Guardar PDF
    </button>
  </div>

  <div class="prop-doc" id="prop-doc">
    <!-- generado por JS -->
  </div>

</div>


<script>
/* ════════════════════════════════════════════════
   CONSTANTES Y ESTADO
════════════════════════════════════════════════ */
const TEMP_KEY = 'pp_propuesta_temp';
const NAVY     = '#003471';
const TEAL     = '#00A8B4';

const DEFAULT_COND = {
  validez_presupuesto: '7 días hábiles a partir de su emisión. Los precios podrán actualizarse en función de la cotización del Dólar Oficial BCRA vigente al momento del pago.',
  condicion_pago:      'El pago deberá efectuarse dentro de los 30 días corridos desde la fecha de emisión de la factura.',
  plazo_entrega:       'La entrega estimada será de 20 días hábiles, sujeta a confirmación según el producto y la disponibilidad de stock al momento de la compra.',
  produccion:          'En productos personalizados con marca podrá registrarse una variación de hasta ±5% en las cantidades. La facturación se efectuará sobre el total efectivamente producido.',
  envio:               'El presupuesto contempla un único envío sin costo adicional dentro de CABA y la Provincia de Buenos Aires, incluyendo Mar del Plata.',
};

let clienteId = null;
let productos = [];

/* ════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════ */
(async function init() {
  try { productos = JSON.parse(localStorage.getItem(TEMP_KEY) || '[]'); } catch(e) {}

  try {
    const res = await fetch('/api/clientes');
    if (res.ok) renderClientSelect(await res.json());
  } catch(e) {}

  resetClienteForm();
  renderProductos();
  actualizarAcciones();
})();

/* ════════════════════════════════════════════════
   CLIENTE
════════════════════════════════════════════════ */
function renderClientSelect(lista) {
  const sel = document.getElementById('select-cliente');
  [...sel.querySelectorAll('option[data-c]')].forEach(o => o.remove());
  lista.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.razon_social; opt.dataset.c = '1';
    sel.add(opt);
  });
  if (clienteId) sel.value = clienteId;
}

async function onSelectCliente(id) {
  if (!id) {
    clienteId = null;
    resetClienteForm();
    return;
  }
  try {
    const res = await fetch(`/api/clientes/${id}`);
    if (!res.ok) return;
    const c = await res.json();
    clienteId = c.id;
    setClienteForm(c);
  } catch(e) {}
}

function resetClienteForm() { setClienteForm({}); }

function setClienteForm(c) {
  document.getElementById('cf-empresa').value    = c.razon_social        || '';
  document.getElementById('cf-atencion').value   = c.contacto            || '';
  document.getElementById('cf-validez').value    = c.validez_presupuesto || DEFAULT_COND.validez_presupuesto;
  document.getElementById('cf-pago').value       = c.condicion_pago      || DEFAULT_COND.condicion_pago;
  document.getElementById('cf-entrega').value    = c.plazo_entrega       || DEFAULT_COND.plazo_entrega;
  document.getElementById('cf-produccion').value = c.produccion          || DEFAULT_COND.produccion;
  document.getElementById('cf-envio').value      = c.envio               || DEFAULT_COND.envio;
}

function leerClienteForm() {
  return {
    razon_social:        document.getElementById('cf-empresa').value.trim(),
    contacto:            document.getElementById('cf-atencion').value.trim(),
    validez_presupuesto: document.getElementById('cf-validez').value.trim(),
    condicion_pago:      document.getElementById('cf-pago').value.trim(),
    plazo_entrega:       document.getElementById('cf-entrega').value.trim(),
    produccion:          document.getElementById('cf-produccion').value.trim(),
    envio:               document.getElementById('cf-envio').value.trim(),
  };
}

async function guardarCliente() {
  const data = leerClienteForm();
  if (!data.razon_social) { alert('Ingresá el nombre de la empresa'); return; }

  const btn = document.querySelector('.btn-guardar-cliente');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  try {
    const url    = clienteId ? `/api/clientes/${clienteId}` : '/api/clientes';
    const method = clienteId ? 'PUT' : 'POST';
    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });

    if (res.status === 401) {
      alert('Sesión expirada. Volvé al catálogo, entrá con ?admin nuevamente y regenerá la propuesta.');
      btn.disabled = false;
      btn.textContent = 'Guardar cliente';
      return;
    }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert('Error al guardar: ' + (err.error || res.status));
      btn.disabled = false;
      btn.textContent = 'Guardar cliente';
      return;
    }

    const saved = await res.json();
    clienteId = saved.id;

    const lista = await fetch('/api/clientes').then(r => r.json());
    renderClientSelect(lista);
    document.getElementById('select-cliente').value = clienteId;
    actualizarAcciones();

    btn.disabled = false;
    btn.textContent = '✓ Guardado';
    setTimeout(() => btn.textContent = 'Guardar cliente', 1500);
  } catch(e) {
    alert('Error de red al guardar el cliente.');
    btn.disabled = false;
    btn.textContent = 'Guardar cliente';
  }
}

/* ════════════════════════════════════════════════
   PRODUCTOS
════════════════════════════════════════════════ */
function imgSrc(foto) {
  if (!foto) return null;
  if (foto.startsWith('http') || foto.startsWith('/')) return foto;
  return `/api/drive/imagen/${foto}`;
}

async function fetchDataUrl(src) {
  try {
    const res = await fetch(src);
    if (!res.ok) return null;
    const blob = await res.blob();
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload  = () => resolve(reader.result);
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(blob);
    });
  } catch {
    return null;
  }
}

function renderProductos() {
  const lista = document.getElementById('productos-lista');
  const countEl = document.getElementById('prod-count');
  countEl.textContent = `${productos.length} producto${productos.length !== 1 ? 's' : ''}`;

  if (!productos.length) {
    lista.innerHTML = `<div class="empty-productos">
      <div class="icon">📋</div>
      No hay productos. Cerrá esta ventana, seleccioná productos en el catálogo y volvé a hacer clic en "Generar propuesta".
    </div>`;
    return;
  }

  lista.innerHTML = productos.map((p, i) => {
    const src = imgSrc(p.foto);
    const imgHtml = src
      ? `<img src="${src}" alt="${p.nombre}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    return `<div class="producto-row" id="prod-row-${i}">
      <div class="producto-row-top">
        <div class="producto-img">
          ${imgHtml}
          <div class="emoji" ${src ? 'style="display:none"' : ''}>${p.emoji}</div>
        </div>
        <div class="producto-info" style="flex:1">
          <div class="producto-nombre">${p.nombre}</div>
          <div class="producto-codigo">Cód. ${p.codigo}</div>
          <div class="producto-desc-edit">
            <div class="desc-label">Descripción (editable)</div>
            <textarea id="p-desc-${i}" rows="3" oninput="syncProd(${i},'descripcion',this.value)">${escHtml(p.descripcion)}</textarea>
          </div>
        </div>
        <button class="btn-quitar" onclick="quitarProducto(${i})" title="Quitar">✕</button>
      </div>
      <div class="producto-row-fields">
        <div class="fld-row-3">
          <div class="fld">
            <label>Tipo de impresión</label>
            <input type="text" value="${escHtml(p.impresion)}" placeholder="Ej: DTF Full Color" oninput="syncProd(${i},'impresion',this.value)" />
          </div>
          <div class="fld">
            <label>Cantidad</label>
            <input type="number" value="${p.cantidad}" placeholder="0" min="0" oninput="syncProd(${i},'cantidad',this.value); recalcTotal(${i})" />
          </div>
          <div class="fld">
            <label>Precio/U. (AR$)</label>
            <input type="number" value="${p.precioUnitario}" placeholder="0,00" step="0.01" oninput="syncProd(${i},'precioUnitario',this.value); recalcTotal(${i})" />
          </div>
          <div class="fld">
            <label>Total (AR$)</label>
            <input type="number" id="p-total-${i}" value="${p.total}" placeholder="0,00" step="0.01" oninput="syncProd(${i},'total',this.value)" />
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function syncProd(i, campo, val) {
  productos[i][campo] = val;
  actualizarAcciones();
}

function recalcTotal(i) {
  const cant = parseFloat(productos[i].cantidad);
  const pu   = parseFloat(productos[i].precioUnitario);
  if (cant > 0 && pu > 0) {
    const tot = (cant * pu).toFixed(2);
    productos[i].total = tot;
    const el = document.getElementById(`p-total-${i}`);
    if (el) el.value = tot;
  }
  actualizarAcciones();
}

function quitarProducto(i) {
  productos.splice(i, 1);
  renderProductos();
  actualizarAcciones();
}

function actualizarAcciones() {
  const info = document.getElementById('acciones-info');
  const btn  = document.getElementById('btn-preview');
  const n    = productos.length;
  const clienteOk = document.getElementById('cf-empresa').value.trim() !== '';
  info.innerHTML = n > 0
    ? `<strong>${n}</strong> producto${n !== 1 ? 's' : ''} · ${clienteOk ? `Cliente: <strong>${document.getElementById('cf-empresa').value.trim()}</strong>` : '<span style="color:#c0392b">Falta completar el cliente</span>'}`
    : 'Sin productos';
  btn.disabled = n === 0;
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ════════════════════════════════════════════════
   FORMATEO
════════════════════════════════════════════════ */
function formatARS(n) {
  const num = parseFloat(n);
  if (isNaN(num)) return '—';
  return '$ ' + num.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function todayStr() {
  const d = new Date();
  const m = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return `Buenos Aires, ${d.getDate()} de ${m[d.getMonth()]} de ${d.getFullYear()}`;
}

    </div>

    <div class="prop-page">
      ${propHeader(logoSrc)}
      <table class="prop-spacer-table">

/* ════════════════════════════════════════════════
   NAVEGACIÓN
════════════════════════════════════════════════ */
async function mostrarPropuesta() {
  if (!productos.length) return;

  const btn = document.getElementById('btn-preview');
  btn.disabled = true;
  btn.innerHTML = '⏳ Cargando imágenes...';

  const imageCache = {};
  const [logoDataUrl, sloganDataUrl, ...imgResults] = await Promise.all([
    fetchDataUrl('logo-pp-color.svg'),
    fetchDataUrl('PP_Slogan.png'),
    ...productos
      .filter(p => p.foto)
      .map(async p => {
        const dataUrl = await fetchDataUrl(imgSrc(p.foto) + '?w=800');
        if (dataUrl) imageCache[p.foto] = dataUrl;
      }),
  ]);
  const logoSrc = logoDataUrl || 'logo-pp-color.svg';
  const sloganSrc = sloganDataUrl || 'PP_Slogan.png';

  btn.innerHTML = 'Ver propuesta';
  btn.disabled = productos.length === 0;

  const thumbCache = {};
  await Promise.all(
    productos.flatMap(p =>
      (p.fotos || []).slice(1, 5).map(async id => {
        const dataUrl = await fetchDataUrl(imgSrc(id) + '?w=200');
        if (dataUrl) thumbCache[id] = dataUrl;
      })
    )
  );

  document.getElementById('prop-doc').innerHTML = buildDoc(imageCache, logoSrc, thumbCache, sloganSrc);
  document.getElementById('vista-editor').style.display    = 'none';
  document.getElementById('vista-propuesta').style.display = 'block';
  window.scrollTo(0, 0);
}

function volverEditor() {
  document.getElementById('vista-propuesta').style.display = 'none';
  document.getElementById('vista-editor').style.display    = 'block';
}

function imprimirPropuesta() {
  const raw = document.getElementById('cf-empresa').value.trim();
  const cliente = raw
    ? (raw.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]/g, '') || 'Cliente')
    : 'Cliente';

  const hoy = new Date();
  const fecha = hoy.getFullYear() + '-' +
    String(hoy.getMonth() + 1).padStart(2, '0') + '-' +
    String(hoy.getDate()).padStart(2, '0');

  const verKey  = 'pp_prop_ver_' + fecha;
  const n_actual = parseInt(localStorage.getItem(verKey) || '0', 10);
  const n_nuevo  = n_actual + 1;
  const ver = 'v' + String(n_nuevo).padStart(2, '0');

  const titulo = `PropuestaComercial_PromoPlanet_${cliente}_${fecha}_${ver}`;

  const titleOriginal = document.title;
  document.title = titulo;

  window.addEventListener('afterprint', function persist() {
    localStorage.setItem(verKey, String(n_nuevo)); // persiste solo si efectivamente imprimió
    document.title = titleOriginal;
    window.removeEventListener('afterprint', persist);
  });

  setTimeout(() => { document.title = titleOriginal; }, 5000); // fallback: solo restaura el title

  window.print();
}
