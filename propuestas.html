<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>Propuestas guardadas — PromoPlanet</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #003471;
    --celeste: #00A8B4;
    --celeste-light: #e0f7f9;
    --gris: #f4f5f7;
    --gris-borde: #e2e4e8;
    --texto: #1a1f2e;
    --texto-suave: #5a6070;
    --blanco: #ffffff;
    --radio: 10px;
    --sombra: 0 2px 16px rgba(0,52,113,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; color: var(--texto); background: var(--gris); font-size: 15px; }

  /* ── TOPBAR ── */
  .topbar {
    background: var(--azul); color: var(--blanco);
    padding: 0 2rem; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar-logo { font-family: 'DM Serif Display', serif; font-size: 1.3rem; text-decoration: none; }
  .topbar-logo span:first-child { color: var(--blanco); }
  .topbar-logo span:last-child  { color: var(--celeste); }
  .topbar-title { font-size: 0.8rem; color: rgba(255,255,255,0.65); letter-spacing: 0.08em; text-transform: uppercase; }
  .topbar-actions { display: flex; gap: 0.75rem; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 0.5rem 1.1rem; border-radius: 8px;
    border: 1.5px solid rgba(255,255,255,0.25); background: transparent;
    color: var(--blanco); font-size: 0.85rem; font-weight: 500;
    cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; text-decoration: none;
  }
  .btn:hover { border-color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.08); }
  .btn-celeste { background: var(--celeste); border-color: var(--celeste); color: var(--blanco); }
  .btn-celeste:hover { background: #009aaa; border-color: #009aaa; }

  /* ── MAIN ── */
  .main { max-width: 960px; margin: 2rem auto; padding: 0 1.5rem 3rem; }

  /* ── TABLA ── */
  .card { background: var(--blanco); border: 1px solid var(--gris-borde); border-radius: var(--radio); box-shadow: var(--sombra); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  thead th {
    background: var(--gris); padding: 0.7rem 1rem;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--texto-suave); text-align: left; border-bottom: 1px solid var(--gris-borde);
  }
  tbody tr { border-bottom: 1px solid var(--gris-borde); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafbfc; }
  tbody td { padding: 0.9rem 1rem; vertical-align: middle; }
  .td-nombre { font-weight: 600; color: var(--azul); }
  .td-nombre small { display: block; font-weight: 400; font-size: 0.75rem; color: var(--texto-suave); margin-top: 1px; }
  .td-actions { display: flex; gap: 0.5rem; justify-content: flex-end; white-space: nowrap; }

  /* ── BADGES DE ESTADO ── */
  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; }
  .badge-borrador { background: #fef3c7; color: #92400e; }
  .badge-enviada  { background: var(--celeste-light); color: #006d76; }
  .badge-ganada   { background: #d1fae5; color: #065f46; }
  .badge-perdida  { background: #fee2e2; color: #991b1b; }

  /* ── BOTONES DE FILA ── */
  .btn-row {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 0.35rem 0.75rem; border-radius: 6px;
    font-size: 0.8rem; font-weight: 500; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    border: 1.5px solid var(--gris-borde); background: var(--blanco); color: var(--texto);
    transition: all 0.15s; text-decoration: none;
  }
  .btn-row:hover { border-color: var(--celeste); color: var(--celeste); }
  .btn-row-danger:hover { border-color: #e74c3c; color: #e74c3c; }

  /* ── EMPTY STATE ── */
  .empty { text-align: center; padding: 4rem 2rem; color: var(--texto-suave); }
  .empty .icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.35; }
  .empty p { margin-bottom: 1.5rem; font-size: 0.95rem; line-height: 1.6; }
  .btn-empty {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 0.6rem 1.5rem; border-radius: 8px;
    background: var(--celeste); color: var(--blanco); border: none;
    font-size: 0.88rem; font-weight: 600; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: background 0.15s;
  }
  .btn-empty:hover { background: #009aaa; }

  @media (max-width: 640px) {
    .col-fecha { display: none; }
    .topbar-title { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="topbar-logo"><span>Promo</span><span>Planet</span></a>
  <span class="topbar-title">Propuestas guardadas</span>
  <div class="topbar-actions">
    <button class="btn btn-celeste" onclick="nuevaPropuesta()">+ Nueva propuesta</button>
  </div>
</div>

<div class="main">
  <div id="contenido"></div>
</div>

<script>
const SESSION_KEY = 'pp_modo_propuesta';

async function iniciarAdmin() {
  const username = prompt('Usuario:');
  if (username === null) return false;
  const pwd = prompt('Contraseña:');
  if (pwd === null) return false;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password: pwd }),
    });
    if (!res.ok) { alert('Credenciales incorrectas'); return false; }
  } catch(e) { alert('Error al conectar con el servidor'); return false; }
  sessionStorage.setItem(SESSION_KEY, '1');
  return true;
}

async function cargarPropuestas() {
  if (sessionStorage.getItem(SESSION_KEY) !== '1') {
    const ok = await iniciarAdmin();
    if (!ok) { window.location.href = '/'; return; }
  }

  let propuestas = [];
  try {
    const res = await fetch('/api/propuestas');
    if (!res.ok) throw new Error(res.status);
    propuestas = await res.json();
  } catch(e) {
    document.getElementById('contenido').innerHTML = `
      <div class="empty">
        <div class="icon">⚠️</div>
        <p>No se pudo cargar la lista de propuestas.<br>Revisá tu conexión e intentá recargar la página.</p>
      </div>`;
    return;
  }

  renderLista(propuestas);
}

function formatFecha(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleDateString('es-AR', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit',
    });
  } catch { return iso; }
}

function badgeEstado(estado) {
  const cls = {
    borrador: 'badge-borrador',
    enviada:  'badge-enviada',
    ganada:   'badge-ganada',
    perdida:  'badge-perdida',
  }[estado] || 'badge-borrador';
  return `<span class="badge ${cls}">${escHtml(estado || 'borrador')}</span>`;
}

function renderLista(propuestas) {
  const el = document.getElementById('contenido');

  if (!propuestas.length) {
    el.innerHTML = `
      <div class="empty">
        <div class="icon">📋</div>
        <p>Todavía no hay propuestas guardadas.<br>Seleccioná productos en el catálogo y armá la primera.</p>
        <button class="btn-empty" onclick="nuevaPropuesta()">Ir al catálogo</button>
      </div>`;
    return;
  }

  const rows = propuestas.map(p => `
    <tr id="row-${p.id}">
      <td class="td-nombre">
        ${escHtml(p.cliente_nombre || 'Sin nombre')}
        <small>#${p.id}</small>
      </td>
      <td>${badgeEstado(p.estado)}</td>
      <td style="text-align:center">${p.cantidad_productos ?? '—'}</td>
      <td class="col-fecha">${formatFecha(p.fecha_actualizacion)}</td>
      <td>
        <div class="td-actions">
          <a href="/propuesta.html?id=${p.id}" target="_blank" class="btn-row">Continuar editando</a>
          <button class="btn-row btn-row-danger" onclick="eliminarPropuesta(${p.id})">Eliminar</button>
        </div>
      </td>
    </tr>`).join('');

  el.innerHTML = `
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Estado</th>
            <th style="text-align:center">Productos</th>
            <th class="col-fecha">Última actualización</th>
            <th></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

async function eliminarPropuesta(id) {
  if (!confirm('¿Eliminar esta propuesta? Esta acción no se puede deshacer.')) return;
  try {
    const res = await fetch(`/api/propuestas/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error(res.status);
  } catch(e) {
    alert('No se pudo eliminar la propuesta.');
    return;
  }
  const row = document.getElementById(`row-${id}`);
  if (row) row.remove();
  const tbody = document.querySelector('tbody');
  if (tbody && !tbody.querySelector('tr')) renderLista([]);
}

function nuevaPropuesta() {
  localStorage.removeItem('pp_propuesta_actual_id');
  window.location.href = '/';
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

cargarPropuestas();
</script>
</body>
</html>
