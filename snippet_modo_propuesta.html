<!-- ═══════════════════════════════════════════════════════════
     MODO PROPUESTA — agregar este bloque justo antes de </body>
     en index.html
═══════════════════════════════════════════════════════════ -->
<style>
  .admin-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
    background: #003471; color: #fff;
    font-size: 0.72rem; font-family: 'DM Sans', sans-serif;
    text-align: center; padding: 4px 0; letter-spacing: 0.04em;
    display: none;
  }
  .admin-banner a {
    color: #00A8B4; cursor: pointer; text-decoration: underline;
    margin-left: 10px;
  }
  .prop-generar-btn {
    background: #00A8B4; color: #fff; border: none;
    border-radius: 14px; padding: 0.65rem 1.25rem;
    font-size: 0.88rem; font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    display: none; align-items: center; gap: 8px;
    box-shadow: 0 4px 20px rgba(0,52,113,0.3);
    cursor: pointer; transition: all 0.2s;
  }
  .prop-generar-btn:hover { background: #009aaa; transform: translateY(-1px); }
  .prop-generar-btn .presup-badge { background: #003471; }
</style>

<div class="admin-banner" id="admin-banner">
  ⚙️ Modo propuesta activo — seleccioná productos del catálogo y hacé clic en "Generar propuesta"
  <a onclick="salirModoAdmin()">Salir</a>
</div>

<script>
(function () {
  const SESSION_KEY = 'pp_modo_propuesta';

  /* ── Entrada por URL ──────────────────────────────────── */
  if (new URLSearchParams(location.search).has('admin')) {
    history.replaceState({}, '', location.pathname);
    iniciarAdmin();
    return;
  }

  /* ── Restaurar sesión si ya estaba activo ─────────────── */
  if (sessionStorage.getItem(SESSION_KEY) === '1') activarUI();

  /* ── Login ────────────────────────────────────────────── */
  async function iniciarAdmin() {
    const pwd = prompt('Contraseña de administrador:');
    if (pwd === null) return;                           // canceló
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: 'admin', password: pwd }),
      });
      if (!res.ok) { alert('Contraseña incorrecta'); return; }
    } catch {
      alert('No se pudo conectar con el servidor');
      return;
    }
    sessionStorage.setItem(SESSION_KEY, '1');
    activarUI();
  }

  /* ── UI de modo propuesta ─────────────────────────────── */
  function activarUI() {
    /* Banner superior */
    const banner = document.getElementById('admin-banner');
    if (banner) {
      banner.style.display = 'block';
      document.body.style.paddingTop = '26px';
      document.querySelector('nav') && (document.querySelector('nav').style.top = '26px');
    }

    /* Botón "Generar propuesta" en la barra flotante */
    const bar = document.querySelector('.presup-bar');
    if (bar) {
      const btn = document.createElement('button');
      btn.id = 'prop-generar-btn';
      btn.className = 'prop-generar-btn';
      btn.innerHTML = `📄 Generar propuesta <div class="presup-badge" id="prop-badge">0</div>`;
      btn.onclick = generarPropuesta;
      bar.prepend(btn);
    }

    /* Interceptar actualizarPresupBtn para mantener el badge sincronizado */
    const _orig = window.actualizarPresupBtn;
    window.actualizarPresupBtn = function () {
      _orig && _orig.call(this);
      const n = (window.seleccion || []).length;
      const badge = document.getElementById('prop-badge');
      const btn   = document.getElementById('prop-generar-btn');
      if (badge) badge.textContent = n;
      if (btn)   btn.style.display = n > 0 ? 'flex' : 'none';
    };
  }

  /* ── Pasar productos y abrir propuesta.html ───────────── */
  function generarPropuesta() {
    const productos = (window.seleccion || []).map(p => ({
      id:           p.id,
      nombre:       p.nombre,
      codigo:       p.codigo,
      descripcion:  p.descripcion || '',
      emoji:        p.emoji || '📦',
      foto:         (p.fotos && p.fotos.length > 0) ? p.fotos[0] : null,
      cantidad:     p.cantidadConsulta || p.minimo || '',
      impresion:    '',
      precioUnitario: '',
      total:        '',
    }));
    localStorage.setItem('pp_propuesta_temp', JSON.stringify(productos));
    window.open('propuesta.html', '_blank');
  }

  /* ── Salir ────────────────────────────────────────────── */
  window.salirModoAdmin = function () {
    sessionStorage.removeItem(SESSION_KEY);
    location.reload();
  };
})();
</script>
